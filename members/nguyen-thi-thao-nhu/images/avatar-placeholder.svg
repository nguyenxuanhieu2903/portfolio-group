<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Soft Pastel Background Gradient -->
    <linearGradient id="softBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Gentle Rose & Lavender Pastel Ring Gradient -->
    <linearGradient id="softRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Skin Tone -->
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="400" rx="36" fill="url(#softBg)" />

  <!-- Soft Glowing Aura -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="url(#softRing)" stroke-width="4" filter="url(#softGlow)" opacity="0.6" />
  <circle cx="200" cy="180" r="130" fill="none" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1.5" stroke-dasharray="6,6" />

  <!-- Back Long Hair Flow (Nữ tính, tóc dài bồng bềnh) -->
  <path d="M 125 155 C 110 200, 105 270, 130 320 C 145 285, 148 240, 150 200 Z" fill="url(#hairGrad)" />
  <path d="M 275 155 C 290 200, 295 270, 270 320 C 255 285, 252 240, 250 200 Z" fill="url(#hairGrad)" />

  <!-- Shoulders & Outfit (Áo cổ tròn thanh lịch) -->
  <path d="M 120 320 C 120 260, 155 240, 200 240 C 245 240, 280 260, 280 320 Z" fill="#ffffff" stroke="rgba(244, 114, 182, 0.4)" stroke-width="2" />
  <!-- Cardigan / Blazer Collar Pastel Lavender -->
  <path d="M 155 242 L 200 300 L 245 242" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="186" y="210" width="28" height="36" rx="8" fill="#fef3c7" />

  <!-- Face Head Oval -->
  <ellipse cx="200" cy="170" rx="46" ry="52" fill="#fffbeb" />

  <!-- Front Hair Fringe (Mái tóc thưa dịu dàng) -->
  <path d="M 152 165 C 148 115, 185 105, 205 105 C 235 105, 252 120, 248 165 C 240 130, 222 120, 202 120 C 175 120, 160 135, 152 165 Z" fill="url(#hairGrad)" />
  <!-- Cute Hair Ribbon / Clip (Kẹp tóc ngọc trai/hoa nhỏ) -->
  <circle cx="160" cy="130" r="7" fill="#f43f5e" />
  <circle cx="160" cy="130" r="3" fill="#ffffff" />

  <!-- Eyebrows & Eyes (Đôi mắt sáng thông minh) -->
  <path d="M 174 154 Q 182 150 190 154" fill="none" stroke="#312e81" stroke-width="2" stroke-linecap="round" />
  <path d="M 210 154 Q 218 150 226 154" fill="none" stroke="#312e81" stroke-width="2" stroke-linecap="round" />
  
  <ellipse cx="182" cy="162" rx="4.5" ry="5" fill="#1e1b4b" />
  <circle cx="184" cy="160" r="1.5" fill="#ffffff" />
  
  <ellipse cx="218" cy="162" rx="4.5" ry="5" fill="#1e1b4b" />
  <circle cx="220" cy="160" r="1.5" fill="#ffffff" />

  <!-- Cute Developer Glasses (Kính cận hồng pastel thanh thoát) -->
  <rect x="168" y="152" width="28" height="20" rx="7" fill="none" stroke="#ec4899" stroke-width="2" />
  <rect x="204" y="152" width="28" height="20" rx="7" fill="none" stroke="#ec4899" stroke-width="2" />
  <line x1="196" y1="162" x2="204" y2="162" stroke="#ec4899" stroke-width="2" />

  <!-- Blush on Cheeks (Má ửng hồng dễ thương) -->
  <ellipse cx="170" cy="174" rx="7" ry="4" fill="#f472b6" opacity="0.45" />
  <ellipse cx="230" cy="174" rx="7" ry="4" fill="#f472b6" opacity="0.45" />

  <!-- Gentle Smile -->
  <path d="M 194 186 Q 200 192 206 186" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />

  <!-- Floating Coding Badges (Pastel Style) -->
  <g transform="translate(48, 75)">
    <rect width="78" height="30" rx="10" fill="#ffffff" stroke="#f472b6" stroke-width="1.5" filter="drop-shadow(0 4px 8px rgba(244, 114, 182, 0.2))" />
    <text x="39" y="19" fill="#db2777" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;dev/&gt;</text>
  </g>

  <g transform="translate(275, 95)">
    <rect width="75" height="30" rx="10" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="drop-shadow(0 4px 8px rgba(168, 85, 247, 0.2))" />
    <text x="37" y="19" fill="#9333ea" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">{ sql }</text>
  </g>

  <g transform="translate(285, 260)">
    <rect width="68" height="30" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" filter="drop-shadow(0 4px 8px rgba(99, 102, 241, 0.2))" />
    <text x="34" y="19" fill="#4f46e5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">C++</text>
  </g>

  <!-- Bottom Tag Badge -->
  <rect x="90" y="345" width="220" height="34" rx="17" fill="#ffffff" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(244, 114, 182, 0.15))" />
  <text x="200" y="367" fill="#831843" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">THẢO NHƯ • BACKEND DEV</text>
</svg>
