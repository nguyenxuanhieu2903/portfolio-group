<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="routeLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="50%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#fdf4ff" />
    </linearGradient>
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="20" fill="url(#routeLightBg)" />

  <!-- Delicate Grid -->
  <g stroke="rgba(148, 163, 184, 0.2)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="380" />
    <line x1="180" y1="0" x2="180" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="420" y1="0" x2="420" y2="380" />
    <line x1="540" y1="0" x2="540" y2="380" />
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="290" x2="600" y2="290" />
  </g>

  <!-- Top Badges -->
  <rect x="40" y="28" width="240" height="34" rx="10" fill="#ffffff" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" filter="drop-shadow(0 4px 10px rgba(139, 92, 246, 0.1))" />
  <text x="160" y="50" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">OPTIMAL ROUTE • TSP GRAPH</text>

  <rect x="360" y="28" width="200" height="34" rx="10" fill="#ffffff" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5" filter="drop-shadow(0 4px 10px rgba(236, 72, 153, 0.1))" />
  <text x="460" y="50" fill="#be185d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">Time: O(N^2 · 2^N) Bitmask</text>

  <!-- Dotted Alternate Paths -->
  <path d="M 120 280 L 190 140 L 320 220 L 450 120 L 510 260 L 370 300 Z" fill="none" stroke="rgba(148, 163, 184, 0.4)" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="120" y1="280" x2="320" y2="220" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Optimal Path (Vibrant Gradient Line) -->
  <path d="M 120 280 L 190 140 L 340 110 L 460 170 L 510 260 L 360 310 Z" fill="none" stroke="url(#pathGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#lightGlow)" />

  <!-- Graph Nodes (Light aesthetic with badges) -->
  <!-- Node A (Start) -->
  <g transform="translate(120, 280)">
    <circle r="15" fill="#ffffff" stroke="#10b981" stroke-width="3.5" filter="drop-shadow(0 4px 8px rgba(16, 185, 129, 0.25))" />
    <circle r="6" fill="#10b981" />
    <rect x="-48" y="22" width="96" height="24" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1" />
    <text x="0" y="38" fill="#065f46" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Start: Điểm A</text>
  </g>

  <!-- Node B -->
  <g transform="translate(190, 140)">
    <circle r="12" fill="#ffffff" stroke="#ec4899" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(236, 72, 153, 0.2))" />
    <circle r="5" fill="#ec4899" />
    <rect x="-40" y="-32" width="80" height="22" rx="5" fill="#ffffff" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1" />
    <text x="0" y="-17" fill="#831843" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Địa điểm B</text>
  </g>

  <!-- Node C -->
  <g transform="translate(340, 110)">
    <circle r="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(139, 92, 246, 0.2))" />
    <circle r="5" fill="#8b5cf6" />
    <rect x="-40" y="-32" width="80" height="22" rx="5" fill="#ffffff" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
    <text x="0" y="-17" fill="#4c1d95" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Địa điểm C</text>
  </g>

  <!-- Node D -->
  <g transform="translate(460, 170)">
    <circle r="12" fill="#ffffff" stroke="#06b6d4" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(6, 182, 212, 0.2))" />
    <circle r="5" fill="#06b6d4" />
    <rect x="-40" y="18" width="80" height="22" rx="5" fill="#ffffff" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <text x="0" y="33" fill="#0e7490" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Địa điểm D</text>
  </g>

  <!-- Node E -->
  <g transform="translate(510, 260)">
    <circle r="12" fill="#ffffff" stroke="#ec4899" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(236, 72, 153, 0.2))" />
    <circle r="5" fill="#ec4899" />
    <rect x="-40" y="18" width="80" height="22" rx="5" fill="#ffffff" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1" />
    <text x="0" y="33" fill="#831843" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Địa điểm E</text>
  </g>

  <!-- Node F -->
  <g transform="translate(360, 310)">
    <circle r="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(139, 92, 246, 0.2))" />
    <circle r="5" fill="#8b5cf6" />
    <rect x="-40" y="18" width="80" height="22" rx="5" fill="#ffffff" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
    <text x="0" y="33" fill="#4c1d95" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Địa điểm F</text>
  </g>
</svg>
